<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="서울특별시교육청 신규 공무원·교육공무직원을 위한 공문서 작성 참고서">
  <title>공문서 작성 참고서</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9.5 12h6M9.5 15.5h6M9.5 8.5h3"/></svg>
    </div>
    <div class="brand-title">
      <p class="eyebrow">행정업무운영편람(2025) · 규정·시행규칙 기준</p>
      <h1>공문서 작성 참고서</h1>
    </div>
    <a class="companion-link" href="quiz/">퀴즈로 복습하기 →</a>
  </header>

  <main class="page-shell">
    <div class="search-bar">
      <input type="search" id="ruleSearchInput" placeholder="규정 검색 (예: 여부, 날짜, 붙임, 경어체)" autocomplete="off">
      <div id="ruleSearchResults" class="search-results hidden"></div>
    </div>

    <div class="panel workspace-panel">
      <div class="practice-intro">
        <h3>완성된 기안문 전체를 붙여넣어 보세요</h3>
        <p id="practiceHint">실제로 작성 중인(또는 작성할) 기안문 전체를 제목 아래부터 붙여넣어 보세요.</p>
      </div>
      <textarea id="practiceInput" class="practice-textarea" rows="12" placeholder="완성된 기안문 전체를 제목 아래부터 붙여넣어 보세요."></textarea>
      <div class="practice-actions">
        <button id="checkButton" class="primary-button" type="button">첨삭하기</button>
        <span id="practiceCount" class="practice-count"></span>
      </div>
      <div id="practicePreviewBlock" class="hidden">
        <p class="preview-label">표시된 원문 <span>— 밑줄 친 부분에 마우스를 올리면 설명이 보여요</span></p>
        <div id="practicePreview" class="practice-preview"></div>
      </div>
      <div id="practiceReport" class="hidden"></div>
    </div>

    <section class="source-strip">
      <div><strong>사용 근거</strong><span>「행정 업무의 운영 및 혁신에 관한 규정」(대통령령) · 동 시행규칙(행정안전부령) 제4조 · 행정업무운영편람(2025)</span></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
