# 2026-08-06: 같은 커밋(8fccb84)으로 반복 배포 시도 시 GitHub Pages 쪽에 남은 이전
# 배포 상태와 충돌해 "Deployment cancelled."로 계속 실패함(로그로 확인). timeout을
# 30분으로 늘려봤지만 deploy-pages가 10분으로 강제 상한하는 걸 확인해 원복하고,
# 새 커밋으로 재시도.
name: Deploy 공문서 작성 도구 모음 to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "공문서참고서/**"
      - "공문서퀴즈/**"
      - "공문서검색/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble site (참고서=루트, 퀴즈=/quiz, 검색전용=/search)
        run: |
          mkdir -p site/quiz site/search
          cp -r "공문서참고서/." site/
          cp -r "공문서퀴즈/." site/quiz/
          cp -r "공문서검색/." site/search/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
